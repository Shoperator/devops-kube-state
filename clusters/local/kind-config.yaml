# Konfiguracija kind klastera za `local`.
#
# Nije ArgoCD Application i niko je ne primenjuje `kubectl apply`-jem -- ovo je
# ulaz za `kind create cluster`, i mora da postoji PRE nego sto ArgoCD uopste
# krene. Zato stoji ovde a ne u `apps/`: root aplikacija prati `apps/`, pa je
# ArgoCD nikada ne vidi.
#
#   kind create cluster --config clusters/local/kind-config.yaml
#
# Jedan cvor: na single-node klasteru kind uklanja control-plane taint, pa sve
# (ukljucujuci monitoring) staje na taj cvor -- nema vise "samo worker moze".
# Stabilnije na WSL-u nego dvocvorni klaster (worker je znao da pada).
#
# Dve stvari ispod su preduslov za `ingress-nginx` iz apps/ingress-nginx.yaml, a
# obe se mogu podesiti SAMO pri kreiranju klastera:
#
#   - node-labels: ingress-ready=true -> nodeSelector kontrolera bira ovaj cvor
#   - extraPortMappings 80/443        -> host portovi izlaze na ovaj cvor
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shophub
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Browser ide na 127.0.0.1:80 -> Docker objavljuje port -> cvor:80 -> nginx.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
