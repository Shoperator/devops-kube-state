apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      values: |
        controller:
          # Ovo je ono sto uopste otvara port 80 na kind klasteru.
          #
          # kind objavljuje portove 80 i 443 control-plane cvora na host, pa
          # zahtev ide: browser -> 127.0.0.1:80 -> cvor:80 -> nginx. Za to
          # nesto mora da slusa na portu 80 samog cvora, i hostPort je ono sto
          # ga zauzima. NodePort Service bi dobio port iz opsega 30000-32767,
          # koji niko ne prosledjuje.
          hostPort:
            enabled: true

          # Samo control-plane cvor ima te port mapping-e; kind-config ga zbog
          # toga i obelezava sa ingress-ready. Na worker cvoru bi kontroler
          # bio zdrav a zauzeo port do kojeg niko ne dolazi.
          nodeSelector:
            ingress-ready: "true"

          service:
            type: NodePort
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          config:
            log-format-escape-json: "true"
            log-format-upstream: '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host","method":"$request_method","path":"$uri","status":$status,"user_agent":"$http_user_agent","bytes_sent":$bytes_sent,"request_time":$request_time}'
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
