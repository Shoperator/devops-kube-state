apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    # Wave 1: needs Loki (wave 0) up to push to.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.1
    helm:
      values: |
        alloy:
          # Mount the host's /var/log so Alloy can tail the pod log files
          # (/var/log/pods/...). File tailing avoids needing pods/log RBAC.
          mounts:
            varlog: true
          configMap:
            content: |-
              // Find every pod log file on the node.
              local.file_match "pods" {
                path_targets = [{ "__path__" = "/var/log/pods/*/*/*.log" }]
              }

              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.process.pods.receiver]
              }

              // Pull namespace / pod / container out of the file path and set
              // them as Loki labels, so a dashboard can filter by shop.
              loki.process "pods" {
                // Strip the CRI wrapper (<time> <stream> <flag>) so the stored
                // line is the raw log — required so the ingress-nginx JSON
                // access logs parse with `| json` (unique visitors / 404-by-path).
                stage.cri {}

                // namespace/pod/container come from the file path, so match the
                // `filename` label rather than the (now de-CRI'd) log line.
                stage.regex {
                  expression = "/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/[0-9]+\\.log"
                  source     = "filename"
                }
                stage.labels {
                  values = {
                    namespace = "",
                    pod       = "",
                    container = "",
                  }
                }
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
        controller:
          type: daemonset
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
