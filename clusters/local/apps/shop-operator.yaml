apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: ghcr.io/shoperator/charts
    chart: shop-operator
    targetRevision: 0.7.0
    helm:
      values: |
        image:
          tag: latest
        # Sufiks pod kojim se objavljuje svaka prodavnica: Shop po imenu "x"
        # se servira na "x.localhost". `localhost` jer browser sam razresava
        # svako ime pod njim na loopback adresu, pa je prodavnica dostupna cim
        # je deploy-ovana -- bez DNS zapisa i bez upisa u hosts fajl.
        #
        # ShopHub mora dobiti istu vrednost (vidi shophub.yaml): operator
        # upisuje Ingress host, ShopHub pravi link koji vlasnik otvara.
        shopBaseDomain: localhost
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
