apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: ghcr.io/shoperator/charts
    chart: shop-operator
    targetRevision: 0.5.0
    helm:
      values: |
        image:
          tag: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
